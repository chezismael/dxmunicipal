<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnóstico municipal de registros de siniestros de tránsito</title>
<meta name="color-scheme" content="light">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  /* Marca Vital Strategies: Reflex Blue (R18 G30 B135), rojo Pantone 7416 (R249 G120 B89), blanco */
  --blue: #121E87;
  --blue-80: #4150A0;
  --blue-40: #A0A5CF;
  --blue-20: #D0D2E7;
  --blue-10: #E8E9F3;
  --red: #F97859;
  --red-20: #FEE4DE;
  --bg: #FFFFFF;
  --surface: #FFFFFF;
  --ink: #111111;
  --muted: #4D4D4D;
  --line: #A0A5CF;
  --accent: #F97859;
  --accent-soft: #FEE4DE;
  --on-accent: #121E87;
  --primary: #121E87;
  --on-primary: #FFFFFF;
  --focus: #121E87;
  --track: rgba(255, 255, 255, .28);
  --dash: rgba(255, 255, 255, .85);
  --note: #E8E9F3;
  color-scheme: light;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
  font-size: 17px;
  line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  background: var(--bg); z-index: 10;
}
button, input, select, textarea { font: inherit; color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ----- Barra superior y avance ----- */
#topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 16px 12px;
}
.tb-in { max-width: 620px; margin: 0 auto; }
.tb-title { font-weight: 700; font-size: 15.5px; line-height: 1.3; }
.tb-meta { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); margin-top: 2px; }
.road { position: relative; height: 14px; border-radius: 7px; background: var(--track); overflow: hidden; margin-top: 8px; }
.road::before {
  content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px;
  background-image: repeating-linear-gradient(90deg, var(--dash) 0 8px, transparent 8px 16px);
}
.road-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); border-radius: 7px; transition: width .4s ease; }
.road-fill::after {
  content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 2px;
  background-image: repeating-linear-gradient(90deg, var(--on-accent) 0 8px, transparent 8px 16px);
}

/* ----- Contenido ----- */
main { max-width: 620px; margin: 0 auto; padding: 22px 16px 150px; }
.banner {
  background: var(--note); border-radius: 10px; padding: 10px 14px; font-size: 14.5px; color: var(--muted); margin-bottom: 22px;
}
.banner a { color: var(--ink); font-weight: 700; }
h1 { font-size: 30px; line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
.lead { font-size: 18px; margin: 0 0 20px; }
.facts { margin: 0 0 20px; padding: 0; }
.facts div { padding: 12px 0; border-top: 1px solid var(--line); }
.facts div:last-child { border-bottom: 1px solid var(--line); }
.facts dt { font-weight: 700; margin: 0; }
.facts dd { margin: 2px 0 0; color: var(--muted); }
.defn { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 24px; }
.defn b { display: block; margin-bottom: 4px; }

.trans {
  background: var(--accent-soft); border-left: 6px solid var(--accent);
  border-radius: 8px; padding: 12px 14px; margin: 0 0 22px; font-size: 16px;
}
[data-focus] { outline: none; }
.src-tag { background: var(--accent-soft); border-left: 6px solid var(--accent); border-radius: 8px; padding: 10px 14px; margin: 0 0 16px; font-size: 16px; }
.qt { font-size: 23px; line-height: 1.28; margin: 0 0 8px; font-weight: 700; outline: none; }
.help { color: var(--muted); font-size: 16px; margin: 0 0 18px; }
.err {
  background: var(--error-soft); color: var(--error); border-radius: 10px; padding: 10px 14px;
  margin: 0 0 14px; font-weight: 700; font-size: 15.5px;
}
.count { color: var(--muted); font-size: 15px; margin: 4px 0 0; }
fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }

/* ----- Opciones ----- */
.optw { margin-bottom: 10px; }
.opt {
  position: relative; display: flex; gap: 14px; align-items: flex-start;
  min-height: 56px; padding: 14px 16px; background: var(--surface);
  border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.opt input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.mark {
  flex: none; width: 26px; height: 26px; margin-top: 1px; border: 2px solid var(--muted);
  background: var(--surface); display: grid; place-items: center;
}
.opt.radio .mark { border-radius: 50%; }
.opt.check .mark { border-radius: 7px; }
.mark svg { width: 16px; height: 16px; opacity: 0; }
.mark svg path { stroke: var(--bg); }
.opt.radio .mark::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--bg); opacity: 0; }
.opt.sel { border-color: var(--ink); background: var(--accent-soft); }
.opt.sel .mark { background: var(--ink); border-color: var(--ink); }
.opt.sel .mark svg, .opt.sel.radio .mark::after { opacity: 1; }
.opt input:focus-visible + .mark { outline: 3px solid var(--focus); outline-offset: 3px; }
.opt.dk { border-style: dashed; background: transparent; color: var(--muted); }
.opt.dk.sel { color: var(--ink); background: var(--accent-soft); }
.optw.dkw { margin-top: 18px; }
.opt.off { opacity: .5; cursor: not-allowed; }
.opt.off input { cursor: not-allowed; }
.ic { display: flex; align-items: center; gap: 2px; flex: none; min-width: var(--icw, 24px); height: 26px; margin-top: 1px; color: var(--muted); }
.opt.sel .ic { color: var(--ink); }
.lbl { padding-top: 1px; }
.other-row { padding: 8px 0 2px 0; }

.grp { margin: 0 0 28px; }
.grp-t { display: block; width: 100%; font-weight: 700; font-size: 19px; padding: 0 0 6px; margin: 0 0 12px; border-bottom: 3px solid var(--accent); }

/* ----- Campos ----- */
.f { margin: 0 0 18px; }
.f > label, .f > legend { display: block; font-weight: 700; margin: 0 0 6px; padding: 0; }
.in, select.in, textarea.in {
  width: 100%; min-height: 54px; padding: 12px 14px; font-size: 17px;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px;
}
textarea.in { min-height: 96px; resize: vertical; }
.in:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-color: var(--ink); }
.in[aria-invalid="true"] { border-color: var(--error); }
.hint { color: var(--muted); font-size: 14.5px; margin: 5px 0 0; }
.ferr { color: var(--error); font-weight: 700; font-size: 15px; margin: 6px 0 0; }

/* ----- Botones ----- */
.btn {
  min-height: 54px; padding: 0 22px; border-radius: 12px; border: 2px solid var(--primary);
  font-weight: 700; font-size: 17px; cursor: pointer; background: transparent; color: var(--ink);
}
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.block { width: 100%; }
.btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: default; }
.btn.quiet { border-color: var(--line); }
.stack { display: grid; gap: 12px; }
.bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.bar-in { max-width: 620px; margin: 0 auto; display: flex; gap: 12px; }
.bar .btn.primary { flex: 1; }
.bar .btn.back { flex: 0 0 auto; min-width: 104px; border-color: var(--line); }
.status { color: var(--muted); font-size: 15px; margin: 4px 0 0; min-height: 1.5em; }

/* ----- Fin ----- */
.done-mark {
  width: 56px; height: 56px; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; margin-bottom: 16px;
}
.done-mark svg { width: 30px; height: 30px; }

/* ----- Vista de revisión ----- */
.rv h2 { font-size: 20px; margin: 30px 0 8px; }
.rv table { width: 100%; border-collapse: collapse; font-size: 15px; }
.rv th, .rv td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rv .scroll { overflow-x: auto; }
.rv-q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
.rv-q .id { display: inline-block; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 0 7px; font-weight: 700; font-size: 14px; margin-right: 6px; }
.rv-q .rule { color: var(--muted); font-size: 14.5px; margin-top: 4px; }
.rv-q .meta { color: var(--muted); font-size: 13.5px; }


[hidden] { display: none !important; }
#layout { max-width: 1000px; margin: 0 auto; }
#notes { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.nb-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 4px; }
.nb-head h2 { font-size: 17px; line-height: 1.3; margin: 0; }
.nb-close { display: none; min-height: 40px; padding: 0 14px; font-size: 15px; }
#nb-hint { margin: 0 0 10px; }
.nb-text { min-height: 240px; font-size: 16px; }
.tb-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.notes-fab {
  flex: none; min-height: 36px; padding: 0 14px; border-radius: 18px; border: 2px solid var(--primary);
  background: var(--surface); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer;
}
.notes-fab:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (max-width: 899px) {
  #notes {
    position: fixed; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 9;
    display: none; max-height: 55vh; overflow-y: auto; margin: 0; border-radius: 14px 14px 0 0;
    box-shadow: 0 -4px 18px rgba(0,0,0,.14);
  }
  #notes.open { display: block; }
  #notes.open .nb-text { min-height: 150px; }
  .nb-close { display: inline-flex; }
}
@media (min-width: 900px) {
  #layout { display: grid; grid-template-columns: minmax(0, 620px) 300px; justify-content: center; gap: 28px; align-items: start; }
  #layout main { margin: 0; }
  #notes { position: sticky; top: 130px; display: block; }
  .notes-fab { display: none !important; }
}

@media (prefers-reduced-motion: reduce) { .road-fill { transition: none; } }
@media (min-width: 700px) { main { padding-top: 34px; } .qt { font-size: 26px; } h1 { font-size: 36px; } }

/* ===== Marca Vital Strategies ===== */
body::before { background: var(--blue); }
h1, .qt, .rv h2, .nb-head h2 { color: var(--blue); }
.qt, h1 { font-weight: 700; letter-spacing: 0; }
.help, .count, .hint { color: var(--muted); }

/* barra superior azul con el ícono blanco */
#topbar { background: var(--blue); color: #fff; border-bottom: 0; padding: 10px 16px 12px; }
.tb-top { gap: 12px; }
.tb-brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.tb-icon { width: 30px; height: 30px; flex: none; display: block; }
.tb-title { color: #fff; font-weight: 700; }
.tb-meta { color: rgba(255, 255, 255, .88); }
.road { background: var(--track); border-radius: 4px; height: 12px; }
.road::before { top: 5px; }
.road-fill { background: var(--red); border-radius: 4px; }
.road-fill::after { top: 5px; background-image: repeating-linear-gradient(90deg, var(--blue) 0 8px, transparent 8px 16px); }
.notes-fab { background: transparent; color: #fff; border: 2px solid #fff; border-radius: 4px; }
.notes-fab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* formas rectas, planas, sin sombras */
.opt, .in, select.in, textarea.in, .btn, .banner, .trans, .src-tag, #notes, .rv-q, .err, .defn { border-radius: 4px; }
.opt { border: 2px solid var(--blue-40); }
.opt.check .mark { border-radius: 4px; }
.mark { border-color: var(--blue); }
.opt.sel { border-color: var(--blue); background: var(--blue-10); }
.opt.sel .mark { background: var(--blue); border-color: var(--blue); }
.opt.dk { border-style: dashed; color: var(--muted); }
.opt.dk.sel { background: var(--blue-10); color: var(--ink); }
.opt input:focus-visible + .mark { outline: 3px solid var(--blue); outline-offset: 3px; }
.ic { color: var(--blue-80); }
.opt.sel .ic { color: var(--blue); }
.in, select.in, textarea.in { border: 2px solid var(--blue-40); }
.in:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-color: var(--blue); }
.in[aria-invalid="true"] { border-color: var(--red); border-width: 3px; }
.ferr { color: #111; background: var(--red-20); border-left: 6px solid var(--red); padding: 6px 10px; border-radius: 4px; }
.err { background: var(--red-20); color: #111; border-left: 6px solid var(--red); border-radius: 4px; }

.trans, .src-tag { background: var(--red-20); border-left: 6px solid var(--red); color: #111; }
.grp-t { color: var(--blue); border-bottom: 3px solid var(--red); }
.banner { background: var(--blue-10); color: #111; }
.banner a { color: var(--blue); }

/* botones */
.btn { border: 2px solid var(--blue); color: var(--blue); background: #fff; font-weight: 700; }
.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
.btn.quiet { border-color: var(--blue-40); color: var(--blue); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
.bar { background: #fff; border-top: 2px solid var(--blue-20); }
.bar .btn.back { border-color: var(--blue-40); color: var(--blue); }
.facts div { border-top: 1px solid var(--blue-40); }
.facts div:last-child { border-bottom: 1px solid var(--blue-40); }
.facts dt { color: var(--blue); }

/* pantalla de inicio */
.hero { background: var(--blue); color: #fff; border-radius: 4px; padding: 28px 22px 26px; margin: 0 0 24px; }
.hero-icon { width: 56px; height: 56px; display: block; margin: 0 0 20px; }
.hero h1 { color: #fff; font-size: 30px; line-height: 1.15; margin: 0 0 14px; }
.hero .lead { color: #fff; margin: 0; font-size: 18px; }
.brandbar { margin: 34px 0 0; padding: 32px 0 8px; border-top: 1px solid var(--blue-40); background: #fff; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-start; gap: 32px 44px; }
.logo-vital { width: 300px; max-width: 100%; height: auto; display: block; }
.logo-prog { width: 340px; max-width: 100%; height: auto; display: block; }
.done-mark { background: var(--blue); color: #fff; border-radius: 50%; }
.rv-q .id { background: var(--blue); color: #fff; }
@media (min-width: 700px) { .hero h1 { font-size: 36px; } }

.send { font-weight: 700; color: #111; background: var(--blue-10); border-left: 6px solid var(--blue); border-radius: 4px; padding: 10px 14px; margin: 0 0 12px; }
.send.bad { background: var(--red-20); border-left-color: var(--red); }

.hint.warn { background: var(--red-20); border-left: 6px solid var(--red); padding: 8px 12px; border-radius: 4px; color: #111; margin: 0 0 10px; }
.flist { list-style: none; margin: 8px 0 0; padding: 0; font-size: 15.5px; }
.flist li { padding: 4px 0; word-break: break-word; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--blue); font-weight: 700; text-decoration: underline; cursor: pointer; font-size: 15.5px; min-height: 36px; }
.filebox input[type=file] { padding: 14px; }

.logo-local { height: 64px; width: auto; max-width: 100%; display: block; }

</style>
</head>
<body>
<header id="topbar" hidden>
  <div class="tb-in">
    <div class="tb-top"><div class="tb-brand"><img class="tb-icon" id="tb-icon" alt="" width="30" height="30"><div class="tb-title" id="tb-title"></div></div><button class="notes-fab" id="notes-open" type="button" aria-controls="notes" aria-expanded="false" hidden>Notas</button></div>
    <div class="tb-meta"><span id="tb-part"></span><span id="tb-time"></span></div>
    <div class="road" id="road" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Avance del cuestionario"><div class="road-fill" id="fill"></div></div>
  </div>
</header>
<div id="layout">
<main id="screen"></main>
<aside id="notes" aria-label="Libreta de notas" hidden>
  <div class="nb-head"><h2 id="nb-title">Notas</h2><button class="btn quiet nb-close" id="notes-close" type="button">Cerrar</button></div>
  <p class="hint" id="nb-hint"></p>
  <label class="sr" for="nb-text">Notas de esta parte</label>
  <textarea class="in nb-text" id="nb-text" placeholder="Anote aquí lo que quiera recordar de esta parte. Se guarda en este dispositivo y se incluye en el CSV junto a las preguntas de esta parte."></textarea>
  <button class="btn primary nb-copy" id="notes-csv" type="button" hidden>Descargar CSV con notas</button>
  <button class="btn quiet nb-copy" id="notes-copy" type="button">Copiar CSV con notas</button>
  <p class="status" id="nb-status" role="status" aria-live="polite"></p>
</aside>
</div>
<datalist id="municipios"></datalist>
<footer class="bar" id="actions" hidden>
  <div class="bar-in">
    <button class="btn back" id="btn-back" type="button">Atrás</button>
    <button class="btn primary" id="btn-next" type="button">Siguiente</button>
  </div>
</footer>
<noscript>Este cuestionario necesita JavaScript para funcionar.</noscript>

/* ---------- Ayudas para condiciones ---------- */
const has = (A, id, v) => Array.isArray(A[id]) && A[id].includes(v);

const isRecv = A => has(A, "G1", "recv");
const hasInfo = A => isOwn(A) || isRecv(A);
const ownTotals = A => has(A, "D1", "totales");
const ownDims = A => anyOf(A, "D1", ["detalle", "dk"]);
const nSrc = A => (A.NF && A.NF !== "dk") ? parseInt(A.NF, 10) : 0;
const tipoHas = (A, v) => Array.isArray((A.I1 || {}).tipo) && A.I1.tipo.includes(v);
const injured = A => ["lesfal", "ambos"].includes(A.C1);
const damage = A => ["danos", "ambos"].includes(A.C1);
const iphUsed = A => has(A, "R3", "iph");
const DIGITAL = ["dispositivo", "nube", "otrosis"];
const digitalStorage = A => anyOf(A, "S1", DIGITAL) || Array.from({ length: 10 }, (_, k) => k + 1).some(i => anyOf(A, "F" + i + "S", DIGITAL));
const manyInst = A => isRecv(A) && (nSrc(A) + (isOwn(A) ? 1 : 0)) >= 2;

/* Preguntas que se repiten por cada fuente que reciben (hasta 10 fuentes) */
const MAX_SRC = 10;
function buildSourceQs() {
  const out = [];
  for (let i = 1; i <= MAX_SRC; i++) {
    const on = A => isRecv(A) && nSrc(A) >= i;
    const tag = A => { const t = ((A._txt || {})["F" + i + "I"] || {})[A["F" + i + "I"]]; return { n: i, total: nSrc(A), name: t || "" }; };
    const rep = i === 1 ? " Estas preguntas se repiten por cada fuente." : "";
    out.push(
      { id: "F" + i + "I", part: "pf", type: "single", sec: 12, tag,
        title: "¿De qué tipo de institución viene esta información?",
        options: [
          { v: "municipal", l: "Otra institución municipal (por ejemplo, Protección Civil y Bomberos, Seguridad Pública, Tránsito)", other: true, ph: "¿Cuál?" },
          { v: "estatal", l: "Otra institución estatal (por ejemplo, SETRAN, Fiscalía del Estado, Policía Vial, C5, IJCF)", other: true, ph: "¿Cuál?" },
          { v: "federal", l: "Otra institución federal (por ejemplo, Guardia Nacional, SICT, INEGI, IMSS)", other: true, ph: "¿Cuál?" }
        ],
        typical: "estatal", when: on,
        rule: "Si G1 incluye «recibe» y el número de fuentes (NF) es mayor o igual a " + i + "." + rep },
      { id: "F" + i + "X", part: "pf", type: "multi", sec: 16, tag,
        title: "¿En qué forma la reciben?", help: "Marque todas las que apliquen.",
        options: [
          { v: "copias", l: "Copias y/u originales de los formatos o informes" },
          { v: "base", l: "Una base de datos (por ejemplo, hoja de cálculo)" },
          { v: "acceso", l: "Acceso directo a su sistema o canal de registro (por ejemplo, WhatsApp)" },
          { v: "resumen", l: "Cifras o reportes resumidos" },
          { v: "otro", l: "Otra(s) forma(s)", other: true, ph: "¿Cuál(es)?" },
          DK
        ],
        typical: ["base"], when: on, rule: "Misma condición que F" + i + "I." },
      { id: "F" + i + "C", part: "pf", type: "multi", sec: 14, tag,
        title: "Cuando reciben copias u originales de formatos o informes, ¿qué hacen con esa información?", help: "Marque todo lo que hacen.",
        options: [
          { v: "captura", l: "La capturan en una hoja de cálculo o sistema" },
          { v: "escaneo", l: "La escanean o fotografían, sin capturar los datos" },
          { v: "archivo", l: "Archivan los documentos" },
          { v: "otro", l: "Otra(s) cosa(s)", other: true, ph: "¿Qué?" },
          DK
        ],
        typical: ["captura"], when: A => on(A) && has(A, "F" + i + "X", "copias"),
        rule: "Si F" + i + "X incluye «Copias y/u originales de los formatos o informes»." },
      { id: "F" + i + "S", part: "pf", type: "multi", sec: 18, tag,
        title: "¿Dónde guardan la información que reciben de esta fuente?", help: "Marque todos los lugares donde se guarda.",
        options: STORAGE,
        typical: ["dispositivo"], when: on, rule: "Misma condición que F" + i + "I." },
      { id: "F" + i + "D", part: "pf", type: "multi", sec: 14, tag,
        title: "¿Qué tipo de información incluye?", help: "Marque todo lo que incluye.",
        options: TIPO_INFO, typical: ["detalle"], when: on, rule: "Misma condición que F" + i + "I." },
      { id: "F" + i + "Y", part: "pf", type: "fields", sec: 14, tag,
        title: "¿De qué años tiene información de esta fuente?", help: "Un año aproximado es suficiente.",
        fields: yearFields, check: yearCheck, typical: {}, when: on, rule: "Misma condición que F" + i + "I." },
      { id: "F" + i + "T", part: "pf", type: "multi", sec: 16, tag,
        title: "¿Qué totales incluye?", help: "Marque todos los que apliquen.",
        options: TOTALES, typical: ["siniestros"], when: A => on(A) && has(A, "F" + i + "D", "totales"),
        rule: "Si F" + i + "D incluye «Conteo de totales»." },
      { id: "F" + i + "V", part: "pf", type: "groups", sec: 36, tag,
        title: "¿Qué información incluye lo que reciben de esta fuente?", help: "Marque todo lo que aplique en cada sección.",
        groups: A => VGROUPS, typical: { siniestro: ["fecha", "hora"], vehiculos: ["tipoveh"], personas: ["edad", "sexo"] },
        when: A => on(A) && anyOf(A, "F" + i + "D", ["detalle", "dk"]),
        rule: "Si F" + i + "D incluye «Información y características de cada siniestro» o «No sé». Tres secciones (Siniestros, Vehículos, Víctimas)." }
    );
  }
  return out;
}

const QBYID = Object.fromEntries(Q.map(q => [q.id, q]));
const PBYID = Object.fromEntries(PARTS.map(p => [p.id, p]));
const PART_OVERHEAD = 5;   // segundos por parte (leer la transición)
const START_OVERHEAD = 20; // segundos de la pantalla de inicio

/* ---------- Motor de rutas ---------- */
function resolve(x, A) { return typeof x === "function" ? x(A) : x; }

/* Devuelve la lista de ids visibles en orden. Las respuestas ya dadas pesan;
   las que faltan se suponen típicas (solo para proyectar tiempo y avance). */
function buildRoute(ans, project) {
  const A = {};
  const route = [];
  for (const q of Q) {
    if (q.when && !q.when(A)) continue;
    route.push(q.id);
    let v = ans[q.id];
    if (v === undefined && project) v = q.typical;
    if (v !== undefined) A[q.id] = v;
  }
  return route;
}

function routeSeconds(route) {
  const parts = new Set();
  let s = START_OVERHEAD;
  for (const id of route) { s += QBYID[id].sec; parts.add(QBYID[id].part); }
  return s + parts.size * PART_OVERHEAD;
}

/* Contexto de respuestas visibles hasta una pregunta (para textos dinámicos) */
function contextFor(ans, upToId) {
  const A = {};
  for (const q of Q) {
    if (q.id === upToId) break;
    if (q.when && !q.when(A)) continue;
    if (ans[q.id] !== undefined) A[q.id] = ans[q.id];
  }
  return A;
}

let state = { ans: {}, txt: {}, notes: {}, sid: newId(), sent: false, hist: [], cur: "start", maxPct: 0, m50: false, m80: false };

/* ---------- Persistencia (solo en este dispositivo) ---------- */
function persist() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* sin almacenamiento */ } }
function restore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s && s.ans && !s.sid) { s.sid = newId(); s.sent = false; }
    return s && s.ans ? s : null;
  } catch (e) { return null; }
}
function clearSaved() { try { localStorage.removeItem(STORE_KEY); } catch (e) { /* nada */ } }

/* ---------- Ayudas ---------- */
const ctx = id => contextFor(state.ans, id);
const optsOf = (q, A) => resolve(q.options, A || ctx(q.id)) || [];
const CHECK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function progressInfo() {
  const route = buildRoute(state.ans, true);
  const total = routeSeconds(route);
  const idx = route.indexOf(state.cur);
  let before = 0;
  if (state.cur === "end") before = total;
  else if (idx > 0) {
    const seen = new Set();
    before = START_OVERHEAD;
    for (let i = 0; i < idx; i++) { before += QBYID[route[i]].sec; seen.add(QBYID[route[i]].part); }
    before += seen.size * PART_OVERHEAD;
  } else before = START_OVERHEAD;
  const pct = Math.min(1, before / total);
  state.maxPct = Math.max(state.maxPct || 0, pct);
  const parts = [];
  route.forEach(id => { const p = QBYID[id].part; if (!parts.includes(p)) parts.push(p); });
  const curPart = state.cur === "end" ? parts[parts.length - 1] : (QBYID[state.cur] || {}).part;
  return { route, total, remaining: Math.max(0, total - before), partIdx: parts.indexOf(curPart) + 1, partTotal: parts.length, partId: curPart, parts };
}

function renderTop() {
  const bar = $("#topbar");
  const ic = $("#tb-icon"); if (ic && !ic.getAttribute("src")) ic.src = ASSETS.icon_white;

  bar.hidden = false;
  const pi = progressInfo();
  $("#tb-title").textContent = state.cur === "end" ? "Cuestionario completo" : PBYID[pi.partId].title;
  $("#tb-part").textContent = state.cur === "end" ? "Gracias" : "Parte " + pi.partIdx + " de " + pi.partTotal;
  let t;
  if (state.cur === "end") t = "Listo";
  else if (state.cur === pi.route[pi.route.length - 1]) t = "Última pantalla";
  else if (pi.remaining < 75) t = "Falta menos de 1 min";
  else t = "Faltan unos " + Math.round(pi.remaining / 60) + " min";
  $("#tb-time").textContent = t;
  const pct = state.cur === "end" ? 100 : Math.round(state.maxPct * 100);
  $("#fill").style.width = pct + "%";
  $("#road").setAttribute("aria-valuenow", String(pct));
}

/* ---------- Navegación ---------- */
function go(id, back) {
  state.cur = id;
  if (id !== "start") persist();   // la pantalla de inicio no debe borrar el avance guardado
  if (id === "start") renderStart();
  else if (id === "end") { renderEnd(); if (CFG.submitUrl && !state.sent) submitResponses(); else if (CFG.submitUrl) setSendStatus("ok"); }
  else renderQuestion(QBYID[id]);
  renderTop();
  const bar = $("#actions");
  bar.hidden = (id === "start" || id === "end" || id === "review");
  if (id !== "start" && id !== "end") {
    $("#btn-next").textContent = (progressInfo().route.slice(-1)[0] === id) ? "Terminar" : "Siguiente";
  }
  renderNotes();
  window.scrollTo(0, 0);
  const h = document.querySelector("[data-focus]");
  if (h) h.focus({ preventScroll: true });
}

function next() {
  const q = QBYID[state.cur];
  if (!validate(q)) return;
  const route = buildRoute(state.ans, true);
  const i = route.indexOf(q.id);
  state.hist.push(q.id);
  go(route[i + 1] || "end");
}
function back() {
  if (state.hist.length) go(state.hist.pop(), true);
  else go("start", true);
}

function syncGroups(q) {

function onGroupChange(input) {

function svgIcon(g) { return '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + GLYPHS[g] + "</svg>"; }
function optionHTML(q, o, anyIc) {

function selectedOf(q) {
  const v = state.ans[q.id];
  if (q.type === "multi") return Array.isArray(v) ? v : [];
  return v === undefined ? [] : [v];
}

function syncOptions(q) {
  const sel = selectedOf(q);
  const full = q.max && sel.length >= q.max;
  document.querySelectorAll('.optw').forEach(w => {
    const v = w.getAttribute("data-ow");
    const input = w.querySelector("input[type=checkbox],input[type=radio]");
    const label = w.querySelector(".opt");
    const on = sel.includes(v);
    input.checked = on;
    label.classList.toggle("sel", on);
    const off = !!(full && !on && q.type === "multi");
    input.disabled = off; label.classList.toggle("off", off);
    const row = w.querySelector(".other-row");
    if (row) row.hidden = !on;
  });
  const c = $("#count");
  if (c) c.textContent = "Ha elegido " + sel.length + " de " + q.max + ".";
}

function onOptionChange(input) {
  const q = QBYID[input.getAttribute("data-qid")];
  const v = input.value;
  const o = optsOf(q).find(x => x.v === v);
  if (q.type === "multi") {
    let cur = selectedOf(q).slice();
    if (input.checked) {
      if (o.ex) { cur = [v]; }
      else {
        const exv = optsOf(q).filter(x => x.ex).map(x => x.v);
        cur = cur.filter(x => !exv.includes(x));
        cur.push(v);
      }
    } else cur = cur.filter(x => x !== v);
    state.ans[q.id] = cur;
    // limpiar textos de opciones que ya no están marcadas
    const t = state.txt[q.id] || {};
    Object.keys(t).forEach(k => { if (!cur.includes(k)) delete t[k]; });
  } else {
    state.ans[q.id] = v;
    const t = state.txt[q.id] || {};
    Object.keys(t).forEach(k => { if (k !== v) delete t[k]; });
  }
  hideError();
  syncOptions(q);
  persist();
  if (o && o.other && input.checked) {
    const f = document.querySelector('[data-other="' + v + '"]');
    if (f) f.focus();
  }
  renderTop();
}

const FILE_MAX = 5 * 1024 * 1024, FILE_N = 3, FILE_EXT = ["pdf", "doc", "docx", "xls", "xlsx", "csv", "txt", "jpg", "jpeg", "png"];
window.__files = window.__files || {};
function fileListItems(q, f) {

}
function refreshFileList(q, k) {

}
async function onFilesChosen(input) {
  const q = QBYID[state.cur], k = input.getAttribute("data-file");
  const er = input.closest(".f").querySelector(".ferr"); er.hidden = true;
  const files = Array.from(input.files); let msg = "";
  if (files.length > FILE_N) msg = "Puede cargar hasta 3 archivos.";
  else for (const f of files) {
    const ext = f.name.split(".").pop().toLowerCase();
    if (!FILE_EXT.includes(ext)) { msg = "«" + f.name + "» no es un formato permitido."; break; }
    if (f.size > FILE_MAX) { msg = "«" + f.name + "» pesa más de 5 MB."; break; }
  }
  if (msg) { er.textContent = msg; er.hidden = false; input.value = ""; return; }
  const read = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(f); });
  const out = [];
  try { for (const f of files) out.push({ name: f.name, type: f.type || "application/octet-stream", size: f.size, b64: await read(f) }); }
  catch (e) { er.textContent = "No se pudo leer el archivo. Inténtelo de nuevo."; er.hidden = false; return; }
  window.__files[q.id + "." + k] = out;
  (state.ans[q.id] = state.ans[q.id] || {})[k] = out.map(x => x.name);
  persist(); refreshFileList(q, k);
}

/* ---------- Validación ---------- */
function showError(msg) { const e = $("#err"); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({ block: "center", behavior: "smooth" }); } }
function hideError() { const e = $("#err"); if (e) e.hidden = true; }

function validate(q) {
  if (q.type === "fields") {
    const A = ctx(q.id);
    const fields = resolve(q.fields, A);
    const cur = state.ans[q.id] || {};
    let first = null;
    fields.forEach(f => {
      const wrap = document.querySelector('[data-f="' + f.k + '"]');
      const er = wrap && wrap.querySelector(".ferr");
      const input = wrap && wrap.querySelector("input,textarea,select");
      if (f.kind === "file") return;
      const raw = cur[f.k];
      const val = Array.isArray(raw) ? raw : (raw || "").trim();
      let msg = "";
      if (f.req && (Array.isArray(val) ? !val.length : !val)) msg = (f.kind === "radio" || f.kind === "checks") ? "Elija al menos una opción." : "Complete este campo.";
      else if (f.kind === "checks" && f.options.some(o => o.other && val.includes(o.v)) && !(cur[f.k + "_otro"] || "").trim()) msg = "Escriba cuál en el espacio de «Otra».";
      else if (f.kind === "radio" && (f.options.find(x => x.v === cur[f.k]) || {}).other && !(cur[f.k + "_otro"] || "").trim()) msg = "Escriba cuál en el espacio de «Otra».";
      else if (f.kind === "email" && val && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) msg = "Escriba un correo válido, por ejemplo nombre@municipio.gob.mx.";
      if (er) { er.textContent = msg; er.hidden = !msg; }
      if (input && f.kind !== "radio" && f.kind !== "checks") input.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg && !first) first = wrap;
    });
    if (!first && q.check) {
      const m = q.check(cur);
      if (m) { showError(m); return false; }
    }
    if (first) { first.scrollIntoView({ block: "center", behavior: "smooth" }); const i = first.querySelector("input,textarea,select"); if (i) i.focus({ preventScroll: true }); return false; }
    return true;
  }
  if (q.type === "groups") {
    const cur = state.ans[q.id] || {};
    for (const g of resolve(q.groups, ctx(q.id))) {
      const sel = cur[g.k] || [];
      if (!sel.length) { showError("Marque al menos una opción en «" + g.title + "». Si no lo sabe, marque «No sé»."); const fs = document.querySelector('[data-g="' + g.k + '"]'); if (fs) fs.scrollIntoView({ block: "start", behavior: "smooth" }); return false; }
      for (const v of sel) {
        const ov = g.options.find(x => x.v === v);
        if (ov && ov.other && !(((state.txt[q.id] || {})[g.k + ":" + v]) || "").trim()) {
          showError("Escriba el dato en el espacio de «" + ov.l + "» en la sección «" + g.title + "»."); const f = document.querySelector('[data-other="' + v + '"][data-gk="' + g.k + '"]'); if (f) f.focus(); return false;
        }
      }
    }
    return true;
  }
  const sel = selectedOf(q);
  const o = optsOf(q);
  const hasDk = o.some(x => x.dk);
  if (!q.optional && (!sel.length || (q.type === "select" && !state.ans[q.id]))) {
    showError(q.type === "multi" ? "Marque al menos una opción para continuar." + (hasDk ? " Si no lo sabe, marque «No sé»." : "")
      : q.type === "select" ? "Elija un año para continuar. Si no lo sabe, elija «No sé»."
      : "Elija una opción para continuar." + (hasDk ? " Si no lo sabe, elija «No sé»." : ""));
    return false;
  }
  for (const v of sel) {
    const ov = o.find(x => x.v === v);
    if (ov && ov.other) {
      const t = ((state.txt[q.id] || {})[v] || "").trim();
      if (!t) { showError("Escriba el dato en el espacio de «" + ov.l + "»."); const f = document.querySelector('[data-other="' + v + '"]'); if (f) f.focus(); return false; }
    }
  }
  return true;
}

/* ---------- Pantalla final y exportación ---------- */
function csvCell(s) { return '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"'; }
function buildCsv() {
  const route = buildRoute(state.ans, false);
  const notes = state.notes || {};
  const rows = [["id", "parte", "pregunta", "respuesta", "detalle_otro"]];
  const seen = {};   // parte -> ids de preguntas recorridas
  const flushNote = p => {
    const n = (notes[p] || "").trim();
    if (n) rows.push(["NOTA." + p, PBYID[p].title, "NOTA de la parte (preguntas " + (seen[p] || []).join(", ") + ")", n, ""]);
  };
  let prev = null;
  route.forEach(id => {
    const q = QBYID[id], A = ctx(id), v = state.ans[id];
    if (prev && prev !== q.part) flushNote(prev);
    prev = q.part; (seen[q.part] = seen[q.part] || []).push(id);
    const tg = q.tag ? resolve(q.tag, Object.assign({}, A, { _txt: state.txt })) : null;
    const title = (tg ? "Fuente " + tg.n + " de " + tg.total + (tg.name ? " (" + tg.name + ")" : "") + ". " : "") + resolve(q.title, A);
    const part = PBYID[q.part].title;
    if (q.type === "fields") {
      const fl = resolve(q.fields, A), cur = v || {};
      fl.forEach(f => {
        let val = cur[f.k] || "";
        let det = "";
        if (f.showIf && cur[f.showIf.k] !== f.showIf.v) return;
        if (f.kind === "checks") { const arr = Array.isArray(val) ? val : []; const ov = f.options.find(o => o.other && arr.includes(o.v)); det = ov ? (cur[f.k + "_otro"] || "") : ""; val = arr.map(x => (f.options.find(o => o.v === x) || {}).l || x).join(" | "); }
        else if (f.kind === "file") { val = (Array.isArray(val) ? val : []).join(" | "); }
        else if (f.kind === "radio") { const oo = f.options.find(x => x.v === val); if (oo && oo.other) det = cur[f.k + "_otro"] || ""; val = oo ? oo.l : val; }
        else if (f.kind === "select") { const oo = f.options.find(x => x.v === val); val = oo ? oo.l : val; }
        rows.push([id + "." + f.k, part, f.label, val, det]);
      });
    } else if (q.type === "groups") {
      const cur = v || {};
      resolve(q.groups, A).forEach(g => {
        const sel = cur[g.k] || [];
        const labels = sel.map(x => { const oo = g.options.find(y => y.v === x); return oo ? oo.l : x; });
        const det = sel.map(x => (state.txt[id] || {})[g.k + ":" + x]).filter(Boolean).join(" | ");
        rows.push([id + "." + g.k, part, title + " (sección " + g.title + ")", labels.join(" | "), det]);
      });
    } else {
      const o = optsOf(q, A);
      const sel = selectedOf(q);
      const labels = sel.map(x => { const oo = o.find(y => y.v === x); return oo ? oo.l : x; });
      const det = sel.map(x => (state.txt[id] || {})[x]).filter(Boolean).join(" | ");
      rows.push([id, part, title, labels.join(" | "), det]);
    }
  });
  if (prev) flushNote(prev);
  // notas de partes que ya no están en la ruta actual (por ejemplo, si cambió una respuesta anterior)
  PARTS.forEach(p => { if (!(p.id in seen) && (notes[p.id] || "").trim()) rows.push(["NOTA." + p.id, p.title, "NOTA de una parte fuera de la ruta actual", notes[p.id].trim(), ""]); });
  return "\uFEFF" + rows.map(r => r.map(csvCell).join(",")).join("\r\n");
}

/* ---------- Envío de respuestas (opcional, solo si hay submitUrl en config.js) ---------- */
function collectAnswers() {
  const route = buildRoute(state.ans, false);
  const out = [];
  route.forEach(id => {
    const q = QBYID[id], A = ctx(id), v = state.ans[id];
    const part = PBYID[q.part].title;
    const tg = q.tag ? resolve(q.tag, Object.assign({}, A, { _txt: state.txt })) : null;
    const title = (tg ? "Fuente " + tg.n + " de " + tg.total + (tg.name ? " (" + tg.name + ")" : "") + ". " : "") + resolve(q.title, A);
    const base = { id, parte: q.part, parte_titulo: part, fuente: tg ? tg.n : null };
    if (q.type === "fields") {
      const cur = v || {};
      resolve(q.fields, A).forEach(f => {
        let val = cur[f.k] || "", code = val, det = "";
        if (f.showIf && cur[f.showIf.k] !== f.showIf.v) return;
        if (f.kind === "checks") { const arr = Array.isArray(val) ? val : []; const ov = f.options.find(o => o.other && arr.includes(o.v)); det = ov ? (cur[f.k + "_otro"] || "") : ""; code = arr; val = arr.map(x => (f.options.find(o => o.v === x) || {}).l || x).join(" | "); out.push(Object.assign({}, base, { id: id + "." + f.k, pregunta: f.label, codigos: code, respuesta: val, detalle: det })); return; }
        if (f.kind === "file") { const names = Array.isArray(val) ? val : []; out.push(Object.assign({}, base, { id: id + "." + f.k, pregunta: f.label, codigos: [], respuesta: names.join(" | "), detalle: "" })); return; }
        if (f.kind === "radio" || f.kind === "select") { const oo = f.options.find(x => x.v === val); if (oo && oo.other) det = cur[f.k + "_otro"] || ""; val = oo ? oo.l : val; }
        out.push(Object.assign({}, base, { id: id + "." + f.k, pregunta: f.label, codigos: code ? [code] : [], respuesta: val, detalle: det }));
      });
    } else if (q.type === "groups") {
      const cur = v || {};
      resolve(q.groups, A).forEach(g => {
        const sel = cur[g.k] || [];
        out.push(Object.assign({}, base, { id: id + "." + g.k, pregunta: title + " (sección " + g.title + ")", codigos: sel,
          respuesta: sel.map(x => { const oo = g.options.find(y => y.v === x); return oo ? oo.l : x; }).join(" | "),
          detalle: sel.map(x => (state.txt[id] || {})[g.k + ":" + x]).filter(Boolean).join(" | ") }));
      });
    } else {
      const o = optsOf(q, A), sel = selectedOf(q);
      out.push(Object.assign({}, base, { pregunta: title, codigos: sel,
        respuesta: sel.map(x => { const oo = o.find(y => y.v === x); return oo ? oo.l : x; }).join(" | "),
        detalle: sel.map(x => (state.txt[id] || {})[x]).filter(Boolean).join(" | ") }));
    }
  });
  return out;
}
function collectFiles() {
  const out = [];
  buildRoute(state.ans, false).forEach(id => {
    const q = QBYID[id]; if (q.type !== "fields") return;
    const cur = state.ans[id] || {};
    resolve(q.fields, ctx(id)).forEach(f => {
      if (f.kind !== "file" || (f.showIf && cur[f.showIf.k] !== f.showIf.v)) return;
      (window.__files[id + "." + f.k] || []).forEach(x => out.push({ campo: id + "." + f.k, nombre: x.name, tipo: x.type, base64: x.b64 }));
    });
  });
  return out;
}
/* Una columna por pregunta, en orden, para la hoja «base» (una fila por formulario) */
function allColumns() {
  const A0 = { G1: ["own", "recv"] }, cols = [];
  Q.forEach(q => {
    const m = /^F(\d+)/.exec(q.id), pre = m ? "Fuente " + m[1] + ". " : "";
    const title = pre + resolve(q.title, A0);
    if (q.type === "fields") { if (q.id === "I1") return; resolve(q.fields, A0).forEach(f => cols.push({ id: q.id + "." + f.k, etiqueta: title + " / " + f.label })); }
    else if (q.type === "groups") resolve(q.groups, A0).forEach(g => cols.push({ id: q.id + "." + g.k, etiqueta: title + " (sección " + g.title + ")" }));
    else cols.push({ id: q.id, etiqueta: title });
  });
  return cols;
}
function buildFila(respuestas) {
  const fila = {};
  respuestas.forEach(r => { if (r.id.indexOf("I1.") === 0) return; fila[r.id] = r.respuesta + (r.detalle ? " (Otro: " + r.detalle + ")" : ""); });
  return fila;
}
function buildPayload() {
  const c = state.ans.I1 || {};
  const resp = collectAnswers();
  const tf = QBYID.I1.fields.find(f => f.k === "tipo");
  const tipo = (Array.isArray(c.tipo) ? c.tipo : []).map(v => (tf.options.find(o => o.v === v) || {}).l || v).join(" | ");
  return {
    submission_id: state.sid, enviado_utc: new Date().toISOString(), version: VERSION, token: CFG.token,
    municipio: c.municipio || "", institucion: c.inst || "", tipo_institucion: tipo, tipo_institucion_otro: c.tipo_otro || "",
    nombre: c.nombre || "", cargo: c.cargo || "", correo: c.correo || "", telefono: c.tel || "",
    ruta: buildRoute(state.ans, false).join(","), respuestas: resp, fila: buildFila(resp), columnas: allColumns(), archivos: collectFiles()
  };
}
function setSendStatus(kind) {
  const el = $("#send-status"), rt = $("#btn-retry"); if (!el) return;
  const msg = { sending: "Enviando sus respuestas…", ok: "Sus respuestas se enviaron. Gracias.", fail: "No se pudieron enviar. Revise su conexión e inténtelo de nuevo." }[kind] || "";
  el.textContent = msg; el.classList.toggle("bad", kind === "fail");
  if (rt) rt.hidden = (kind !== "fail");
}
async function submitResponses() {
  if (!CFG.submitUrl) return;
  setSendStatus("sending");
  try {
    // text/plain evita la verificación previa (CORS) en servicios como Google Apps Script
    await fetch(CFG.submitUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(buildPayload()) });
    state.sent = true; persist(); setSendStatus("ok");
  } catch (e) { setSendStatus("fail"); }
}

function renderEnd() {
  const none = !hasInfo(state.ans.G1 ? { G1: state.ans.G1 } : {});
  const msg = none
    ? "Saber que su institución no registra ni recibe esta información también nos ayuda a completar el mapa del municipio."
    : "Sus respuestas nos ayudan a entender cómo se registran los siniestros de tránsito en el municipio.";
  $("#screen").innerHTML =
    '<div class="done-mark">' + CHECK.replace("<svg", '<svg stroke="currentColor"') + "</div>" +
    '<h1 data-focus tabindex="-1">Gracias por responder</h1>' +
    '<p class="lead">' + esc(msg) + "</p>" +
    '<p>El equipo revisará sus respuestas y, si usted lo indicó, se pondrá en contacto para dar seguimiento.</p>' +
    (PROTOTYPE && !CFG.submitUrl ? '<div class="banner">Versión de prueba. Sus respuestas no se enviaron a nadie. Puede guardar una copia para revisarlas.</div>' : "") +
    (CFG.submitUrl ? '<p class="status send" id="send-status" role="status" aria-live="polite"></p><button class="btn primary block" id="btn-retry" hidden>Reintentar el envío</button>' : "") +
    '<div class="stack">' +
    '<button class="btn ' + (CFG.submitUrl ? "quiet" : "primary") + ' block" id="btn-download"' + (downloadsApi ? "" : " hidden") + ">Descargar mis respuestas (.csv)</button>" +
    '<button class="btn block" id="btn-copy">Copiar mis respuestas</button>' +
    '<button class="btn quiet block" id="btn-review">Revisar o corregir mis respuestas</button>' +
    '<button class="btn quiet block" id="btn-new">Empezar un cuestionario nuevo</button></div>' +
    '<p class="status" id="status" role="status" aria-live="polite"></p>';
}

async function doDownload() {
  const st = $("#status");
  try {
    await downloadsApi.save({ filename: "respuestas_diagnostico_municipal.csv", data: buildCsv() });
    st.textContent = "Archivo guardado.";
  } catch (e) {
    st.textContent = (e && e.code === "declined") ? "No se guardó el archivo." : "No se pudo guardar el archivo. Pruebe con «Copiar mis respuestas».";
  }
}
async function doCopy() {
  const st = $("#status"), text = buildCsv().replace("\uFEFF", "");
  try { await navigator.clipboard.writeText(text); st.textContent = "Respuestas copiadas. Puede pegarlas en un correo o en una hoja de cálculo."; return; } catch (e) { /* intento alterno */ }
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); document.body.removeChild(ta);
    st.textContent = ok ? "Respuestas copiadas." : "No se pudo copiar en este dispositivo.";
  } catch (e) { st.textContent = "No se pudo copiar en este dispositivo."; }
}

/* ---------- Vista de revisión (#revision) ---------- */
const SCENARIOS = {
  "A. Sin información": { I1: { municipio: "x", inst: "x", tipo: ["transito"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["none"] },
  "B. Solo recibe, de una fuente": { I1: { municipio: "x", inst: "x", tipo: ["obras"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["recv"], NF: "1", X6: "no" },
  "C. Levanta en sitio, solo totales": { I1: { municipio: "x", inst: "x", tipo: ["policia"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["own"], D1: ["totales"], R3: ["ninguno"], S1: ["papel"] },
  "D. Policía: IPH y herramienta propia en papel, captura en Excel": { I1: { municipio: "x", inst: "x", tipo: ["policia"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["own"], R3: ["iph", "propio"], R5: "papel", R7: ["hoja"], S1: ["dispositivo"], X6: "no" },
  "D2. Tránsito (sin IPH)": { I1: { municipio: "x", inst: "x", tipo: ["transito"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["own"], R3: ["propio"], R5: "papel", R7: ["hoja"], S1: ["dispositivo"], X6: "no" },
  "E. Máximo: levanta y recibe, todo activo": { I1: { municipio: "x", inst: "x", tipo: ["policia"], nombre: "x", cargo: "x", correo: "x@x.mx" }, G1: ["own", "recv"], D1: ["detalle"], C1: "ambos", N2: "aveces", R3: ["iph", "propio", "mensajes", "central"], R2: ["papel", "escaneo", "captura"], R5: "ambos", R7: ["hoja", "libro"], NF: "3", F1X: ["copias"], X4: "si", X6: "regular" }
};
function fillScenario(over) {
  const ans = {};
  for (let i = 0; i < 6; i++) buildRoute(ans, true).forEach(id => { if (ans[id] === undefined) ans[id] = over[id] !== undefined ? over[id] : QBYID[id].typical; });
  Object.keys(over).forEach(k => { ans[k] = over[k]; });
  return ans;
}
function renderReview() {
  state.cur = "review";
  $("#topbar").hidden = true; $("#actions").hidden = true;
  $("#notes").hidden = true; $("#notes-open").hidden = true;
  const rows = Object.entries(SCENARIOS).map(([n, o]) => {
    const r = buildRoute(fillScenario(o), false);
    return "<tr><td>" + esc(n) + "</td><td>" + r.length + "</td><td>" + (routeSeconds(r) / 60).toFixed(1) + "</td></tr>";
  }).join("");
  const A0 = { G1: ["own"] };
  const list = PARTS.map(p => "<h2>" + esc(p.title) + "</h2>" + Q.filter(q => q.part === p.id && !/^F(\d+)/.test(q.id) || (q.part === p.id && /^F1[A-Z]/.test(q.id))).map(q =>
    '<div class="rv-q"><span class="id">' + q.id + "</span>" + esc(resolve(q.title, A0)) +
    '<div class="meta">' + ({ fields: "campos", single: "una opción", select: "lista", multi: "varias opciones", groups: "secciones con varias opciones" }[q.type]) + ", unos " + q.sec + " s</div>" +
    '<div class="rule">Regla. ' + esc(q.rule) + "</div></div>").join("")).join("");
  $("#screen").innerHTML = '<div class="rv"><p><a href="#" id="rv-back">Volver al cuestionario</a></p><h1>Vista de revisión</h1>' +
    "<p>Reglas de salto y tiempos de cada pregunta. Los tiempos son supuestos de trabajo (segundos por pantalla más lectura de transiciones) y deben confirmarse con una prueba piloto.</p>" +
    '<h2>Recorridos de ejemplo</h2><div class="scroll"><table><thead><tr><th>Recorrido</th><th>Pantallas</th><th>Minutos</th></tr></thead><tbody>' + rows + "</tbody></table></div>" + list + "</div>";
  window.scrollTo(0, 0);
}

/* ---------- Eventos ---------- */
document.addEventListener("click", e => {
  const id = e.target.id;
  if (id === "btn-start") { state = { ans: {}, txt: {}, notes: {}, sid: newId(), sent: false, hist: [], cur: "start", maxPct: 0, m50: false, m80: false }; go("I1"); }
  else if (id === "btn-resume") { const s = restore(); if (s) { state = s; go(state.cur); } }
  else if (id === "btn-restart") { clearSaved(); state = { ans: {}, txt: {}, notes: {}, sid: newId(), sent: false, hist: [], cur: "start", maxPct: 0, m50: false, m80: false }; go("I1"); }
  else if (id === "btn-next") next();
  else if (id === "btn-back") back();
  else if (id === "btn-download") doDownload();
  else if (id === "btn-copy") doCopy();
  else if (id === "btn-retry") submitResponses();
  else if (e.target.matches && e.target.matches("[data-clearfiles]")) {
    const q = QBYID[state.cur], k = e.target.getAttribute("data-clearfiles");
    delete window.__files[q.id + "." + k]; (state.ans[q.id] || {})[k] = []; const fi = document.querySelector('input[type=file][data-file="' + k + '"]'); if (fi) fi.value = ""; persist(); refreshFileList(q, k);
  }
  else if (id === "btn-review") { state.sent = false; const route = buildRoute(state.ans, false); state.hist = route.slice(0, -1); go(route[route.length - 1]); }
  else if (id === "btn-new") { clearSaved(); state = { ans: {}, txt: {}, notes: {}, sid: newId(), sent: false, hist: [], cur: "start", maxPct: 0, m50: false, m80: false }; go("start"); }
  else if (id === "notes-open") toggleNotes(!$("#notes").classList.contains("open"));
  else if (id === "notes-close") toggleNotes(false);
  else if (id === "notes-copy") copyNotes();
  else if (id === "notes-csv") downloadFromNotes();
  else if (id === "rv-back") { e.preventDefault(); location.hash = ""; }
});

document.addEventListener("change", e => {
  const t = e.target;
  if (t.matches("input[type=file][data-file]")) onFilesChosen(t);
  else if (t.matches("input[data-fcheck]")) {
    const q = QBYID[state.cur], k = t.getAttribute("data-fcheck"); const cur = state.ans[q.id] || (state.ans[q.id] = {});
    let arr = Array.isArray(cur[k]) ? cur[k].slice() : [];
    arr = t.checked ? arr.concat([t.value]) : arr.filter(x => x !== t.value);
    cur[k] = arr;
    t.closest(".opt").classList.toggle("sel", t.checked);
    const r = t.closest(".optw").querySelector(".other-row"); if (r) { r.hidden = !t.checked; if (t.checked) r.querySelector("input").focus(); }
    const er = t.closest("fieldset").querySelector(".ferr"); if (er) er.hidden = true;
    persist();
  }
  else if (t.matches("input[data-gk][type=checkbox]")) onGroupChange(t);
  else if (t.matches("input[data-qid][type=checkbox],input[data-qid][type=radio]")) onOptionChange(t);
  else if (t.matches("select[data-field]")) {
    const q = QBYID[state.cur]; const cur = state.ans[q.id] || (state.ans[q.id] = {});
    cur[t.getAttribute("data-field")] = t.value; t.setAttribute("aria-invalid", "false");
    const er = t.parentElement.querySelector(".ferr"); if (er) er.hidden = true; hideError(); persist();
  }
  else if (t.matches("select[data-qid]")) { state.ans[t.getAttribute("data-qid")] = t.value; hideError(); persist(); renderTop(); }
  else if (t.matches("input[data-fradio]")) {
    const q = QBYID[state.cur]; const cur = state.ans[q.id] || (state.ans[q.id] = {}); cur[t.getAttribute("data-fradio")] = t.value;
    t.closest("fieldset").querySelectorAll(".opt").forEach(l => l.classList.toggle("sel", l.querySelector("input").checked));
    const er = t.closest("fieldset").querySelector(".ferr"); if (er) er.hidden = true;
    t.closest("fieldset").querySelectorAll(".optw").forEach(w => { const r = w.querySelector(".other-row"); if (r) r.hidden = !w.querySelector("input[type=radio]").checked; });
    const op = t.closest(".optw").querySelector(".other-row input"); if (op && !op.closest(".other-row").hidden) op.focus();
    applyShowIf();
    persist();
  }
});

document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "nb-text") {
    state.notes = state.notes || {};
    state.notes[t.dataset.part] = t.value;
    persist();
  } else if (t.matches("input[data-other][data-gk]")) {
    const qid = t.getAttribute("data-gq");
    (state.txt[qid] = state.txt[qid] || {})[t.getAttribute("data-gk") + ":" + t.getAttribute("data-other")] = t.value;
    hideError(); persist();
  } else if (t.matches("input[data-other]")) {
    const qid = t.getAttribute("data-qid");
    (state.txt[qid] = state.txt[qid] || {})[t.getAttribute("data-other")] = t.value;
    hideError(); persist();
  } else if (t.matches("[data-field]")) {
    const q = QBYID[state.cur]; const cur = state.ans[q.id] || (state.ans[q.id] = {});
    cur[t.getAttribute("data-field")] = t.value;
    t.setAttribute("aria-invalid", "false");
    const er = t.parentElement.querySelector(".ferr"); if (er) er.hidden = true;
    persist();
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.matches("input.in[type=text],input.in[type=email],input.in[type=tel]") && !e.target.matches("[data-other]")) { e.preventDefault(); next(); }
});

function route() {
  if (location.hash === "#revision" && CFG.reviewerTools) { renderReview(); return; }
  if (state.cur === "review") { state.cur = "start"; }
  if (state.cur === "start") go("start");
}
window.addEventListener("hashchange", () => { if (location.hash === "#revision" && CFG.reviewerTools) renderReview(); else { const s = restore(); state.cur = "start"; go("start"); } });

/* ---------- Arranque ---------- */
(function init() {
  const dl = document.getElementById("municipios");
  dl.innerHTML = MUNICIPIOS.map(m => '<option value="' + esc(m) + '"></option>').join("");
  if (location.hash === "#revision" && CFG.reviewerTools) renderReview(); else go("start");
  // Fuera de Claude (archivo descargado o publicado en otro sitio): descarga directa con el navegador
  if (!(window.claude && window.claude.use)) {
    downloadsApi = { save: async ({ filename, data }) => {
      const url = URL.createObjectURL(new Blob([data], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a"); a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } };
    const nb = document.getElementById("notes-csv"); if (nb) nb.hidden = false;
  }
  try {
    if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { downloadsApi = d; const b = document.getElementById("btn-download"); if (b && d) b.hidden = false; const nb = document.getElementById("notes-csv"); if (nb && d) nb.hidden = false; }).catch(() => {});
  } catch (e) { /* sin descargas */ }
})();
